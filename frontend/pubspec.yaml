name: capstone
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  intl: 0.20.2
  camera: ^0.10.5+5
  path_provider: ^2.1.1
  path: ^1.8.3
  table_calendar: ^3.0.9
  http: ^1.1.0
  shared_preferences: ^2.0.15
  video_player: ^2.9.2   
  audioplayers: ^6.5.1
  kakao_flutter_sdk: ^1.9.5
  kakao_flutter_sdk_user: ^1.9.5

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  fl_chart: ^0.65.0
  url_launcher: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/kakao.png
    - assets/home_0.png
    - assets/home_1.png
    - assets/calendar_0.png
    - assets/calendar_1.png
    - assets/contents_0.png
    - assets/contents_1.png
    - assets/user_0.png
    - assets/user_1.png
    - assets/profile_default.png
    - assets/chart.png
    - assets/brain.png
    - assets/envelope.png
    - assets/gifs/trash.gif
    - assets/trash_0.png
    - assets/trash_1.png
    - assets/message_0.png
    - assets/message_1.png
    - assets/message_2.png
    - assets/message_3.png
    - assets/check.png
    - assets/box.png
    - assets/spring.png
    - assets/sounds/paper.mp3
    - assets/back.png
    - assets/ai_character.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/ai_character.png"

  # To add assets to your application, add an assets section, like this:
  # assets:
